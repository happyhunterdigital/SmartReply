# Firebase App Hosting backend - SmartReply web app.
# Build: npm run build (prisma generate && next build).
#
# Secrets live in Cloud Secret Manager. Create each one with
#   firebase apphosting:secrets:set NAME
# then reference it below with `secret: NAME`. Values are never committed.
runConfig:
  # Keep one warm instance so the Meta webhook answers fast.
  minInstances: 1
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # Public, non-secret values.
  - variable: NEXTAUTH_URL
    value: https://smartreply.happyhunterdigital.com
  - variable: META_GRAPH_API_VERSION
    value: v25.0
  - variable: EMAIL_FROM
    value: "SmartReply <motsumitl@happyhunterdigital.com>"

  # Secrets. Must be referenced here or App Hosting will not inject them.
  - variable: NEXTAUTH_SECRET
    secret: NEXTAUTH_SECRET
  - variable: CRON_SECRET
    secret: CRON_SECRET
  - variable: ENCRYPTION_KEY
    secret: ENCRYPTION_KEY
  - variable: DATABASE_URL
    secret: DATABASE_URL
  - variable: REDIS_URL
    secret: REDIS_URL
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: INSTAGRAM_APP_ID
    secret: INSTAGRAM_APP_ID
  - variable: INSTAGRAM_APP_SECRET
    secret: INSTAGRAM_APP_SECRET
  - variable: FACEBOOK_APP_SECRET
    secret: FACEBOOK_APP_SECRET
  - variable: WEBHOOK_VERIFY_TOKEN
    secret: WEBHOOK_VERIFY_TOKEN
